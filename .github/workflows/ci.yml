name: Backend CI

on:
  push:
    branches: [main]
    # 문서·측정 결과만 바뀐 push는 테스트·배포를 돌리지 않음 (배포 중 백엔드가 뜨는 20초 동안 502가 나므로)
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'perf/**'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew test
        env:
          # local 프로필의 H2 TCP 서버 대신 메모리 DB 사용
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb

  # H2와 MySQL은 락·SQL 동작이 달라서, 운영과 같은 MySQL 8.0 + Flyway 스키마로도 전체 테스트를 돌림
  test-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: inmyticket_test
          TZ: Asia/Seoul
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -ptestroot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Test on MySQL
        run: ./gradlew test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/inmyticket_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: testroot
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
          SPRING_FLYWAY_ENABLED: 'true'
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate
          JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul

  image:
    needs: [test, test-mysql]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dongri-p/inmyticket-backend:latest
            ghcr.io/dongri-p/inmyticket-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/InMyTicket/InMyTicket_deploy
            git pull --ff-only
            sudo docker compose pull backend
            sudo docker compose up -d --no-deps redis backend
            sudo docker compose exec -T frontend nginx -s reload
            sudo docker image prune -f