spring:
  datasource:
    url: jdbc:h2:tcp://localhost/~/inmyticket
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true  
  h2:
    console:
      enabled: true
  flyway:
    enabled: false

# 로컬 개발 전용 기본값 — 어떤 방식으로 실행하든(VS Code Run/Debug, gradlew bootRun 등)
# 환경변수 설정 여부와 무관하게 뜨도록 함. prod는 application-prod.yml에 별도 값이 없어
# 여전히 JWT_SECRET/ADMIN_LOGIN_ID/ADMIN_PASSWORD/KOPIS_API_KEY 환경변수가 필수임.
jwt:
  secret: local-dev-only-secret-key-not-for-production-use-32chars
admin:
  login-id: admin
  password: ChangeMe1234!
kopis:
  api-key: local-dev-dummy-kopis-key
toss:
  # 토스페이먼츠 문서에 공개된 테스트용 시크릿 키 (테스트 결제라 실제 청구 없음). 프론트 기본 클라이언트 키와 짝
  secret-key: test_sk_zXLkKEypNArWmo50nX3lmeaxYG5R

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
