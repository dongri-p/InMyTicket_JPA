spring:
  profiles:
    default: local
  # 요청을 가상 스레드에서 처리: 결제는 PG 응답(데모 1.5초)을 기다리는 동안 요청 스레드를 붙잡는데,
  # 플랫폼 스레드(Tomcat 기본 200개)면 결제가 몰릴 때 스레드가 바닥나 좌석 조회 같은 가벼운 요청까지 줄을 섬.
  # 가상 스레드는 기다리는 동안 OS 스레드를 놓아줌 (DB 커넥션은 OSIV를 꺼서 PG 통신 중엔 이미 안 잡고 있음)
  threads:
    virtual:
      enabled: true
  # 커넥션을 처음부터 autocommit=false로 두고, Hibernate에게 그 사실을 알려 트랜잭션마다 켰다 끄지 않게 함.
  # 안 그러면 트랜잭션 하나에 SET autocommit=0 / =1 왕복이 두 번 붙음 (대량 데이터 부하에서 실제 쿼리보다 많았음).
  # 트랜잭션 밖에서 DB를 읽은 커넥션은 풀에 돌아갈 때 롤백됨 (JPA는 트랜잭션 밖 쓰기를 예외로 막으므로 쓰기가 사라지지는 않음)
  datasource:
    hikari:
      auto-commit: false
  jpa:
    # OSIV 끔: 켜져 있으면 HTTP 요청 하나 동안 EntityManager를 공유해, 서비스에서 트랜잭션을 나눠도
    # 앞 트랜잭션에서 캐시된 엔티티를 뒤 트랜잭션의 락 조회가 그대로 받음(취소 중 결제 완료를 못 봄).
    # 또 요청이 끝날 때까지 DB 커넥션을 붙잡아 PG 통신 동안에도 커넥션을 점유함
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        connection:
          provider_disables_autocommit: true

server:
  # nginx 뒤에서 실행되므로 X-Forwarded-For로 실제 클라이언트 IP를 복원 (로그인 잠금 키에 사용).
  # Tomcat RemoteIpValve는 내부망(10/8, 172.16/12, 192.168/16, loopback)에서 온 헤더만 신뢰하고
  # 오른쪽부터 첫 번째 외부 IP를 고르므로, 클라이언트가 헤더를 위조해 앞에 끼워 넣어도 무시됨
  forward-headers-strategy: native

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

kopis:
  api-key: ${KOPIS_API_KEY}
  base-url: http://www.kopis.or.kr/openApi/restful

toss:
  # 토스페이먼츠 개발자센터의 "주문서형, 결제창형 연동 키 > 시크릿 키"(test_gsk_). 프론트의 클라이언트 키와 같은 상점의 키여야 함
  secret-key: ${TOSS_SECRET_KEY}
  base-url: https://api.tosspayments.com

admin:
  login-id: ${ADMIN_LOGIN_ID}
  password: ${ADMIN_PASSWORD}

reservation:
  # 결제 없이 이 시간(분)이 지난 PENDING 예약은 좌석을 자동 회수함
  pending-timeout-minutes: 10
  # 결제 시작 후 이 시간(분)이 지나도 PROCESSING이면 서버 중단 등으로 고착된 것으로 보고 PENDING으로 복구함
  # (PG 통신은 수 초 내에 끝나므로 진행 중인 결제를 건드리지 않을 만큼 넉넉하게 잡음)
  processing-timeout-minutes: 5
  # 자동 회수 스케줄러 실행 주기(ms)
  expiration-check-interval-ms: 60000

performance:
  # 공연 목록 예매 상태 그룹(예매중/오픈예정/공연종료)을 시간 경과에 맞춰 갱신하는 주기(ms)
  booking-group-refresh-interval-ms: 60000
  # 목록 첫 페이지의 전체 건수(totalCount) 캐시 유지 시간(ms). 검색어 없는 필터 조합만 캐시, 0이면 끔
  list-count-cache-ttl-ms: 30000

springdoc:
  # nginx는 /api/만 백엔드로 넘기므로 문서도 /api 아래에 둠 (운영에서도 nginx 수정 없이 열림)
  api-docs:
    path: /api/docs/openapi
  swagger-ui:
    path: /api/docs
    tags-sorter: alpha
    operations-sorter: method

cors:
  # 프런트엔드가 붙는 도메인 목록(콤마 구분). 운영 배포 시 CORS_ALLOWED_ORIGINS 환경변수로 실제 프런트엔드 도메인을 지정할 것
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
